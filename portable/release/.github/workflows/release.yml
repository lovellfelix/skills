name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish npm package
        if: steps.vars.outputs.tag != '' && contains(steps.vars.outputs.tag, 'v')
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN is required to publish to npm. Set secrets.NPM_TOKEN in your repo (https://docs.github.com/actions/publishing-packages/publishing-nodejs-packages)." >&2
            exit 2
          fi
          bash tools/release/publish-npm.sh --dist-dir .
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish PyPI
        run: |
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "PYPI_API_TOKEN (secrets.PYPI_API_TOKEN) is required to publish to PyPI. Create a PyPI API token and add it to repo secrets." >&2
            exit 2
          fi
          bash tools/release/publish-pypi.sh --dist-dir dist
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish Cargo
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "CARGO_REGISTRY_TOKEN is required to publish crates.io packages. Set secrets.CARGO_REGISTRY_TOKEN in your repo." >&2
            exit 2
          fi
          bash tools/release/publish-cargo.sh --manifest-path Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "GITHUB_TOKEN is required to create a release. Set secrets.GITHUB_TOKEN in your repo. See https://docs.github.com/actions/security-guides/automatic-token-authentication" >&2
            exit 2
          fi
          bash tools/release/github-release.sh --tag "${{ steps.vars.outputs.tag }}" --notes-file handoff/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          echo "Installing syft..."
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (syft)
        run: |
          mkdir -p sbom
          echo "Generating SBOMs (spdx + cyclonedx)..."
          syft dir:. -o spdx-json=sbom/spdx.json || true
          syft dir:. -o cyclonedx-json=sbom/cyclonedx.json || true

      - name: Install Trivy
        run: |
          echo "Installing trivy..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run vulnerability scanners (trivy)
        run: |
          echo "Running vulnerability scanners. Fail on CRITICAL/HIGH."
          trivy fs --format json --output trivy-report.json --severity CRITICAL,HIGH . || true


      - name: Upload SBOM & scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-scans
          path: |
            sbom/
            trivy-report.json
