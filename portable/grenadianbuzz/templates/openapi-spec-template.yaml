openapi: 3.0.3
info:
  title: GrenadianBuzz API
  version: 1.0.0
  description: API specification template for GrenadianBuzz services.
servers:
  - url: https://api.example.com/v1
paths:
  /posts:
    get:
      summary: List posts
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
components:
  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
        authorId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, authorId, content, createdAt]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
