name: KB validation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - '.githooks/**'
      - 'tags.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Make pre-commit script executable
        run: chmod +x .githooks/pre-commit || true
      - name: Run KB checks
        run: |
          chmod +x scripts/*.js scripts/*.sh || true
          ./scripts/kb-change-summary.sh
